<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PhotoCloud | Il tuo archivio sicuro</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1976d2">
    <script src="/register-pwa.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-top-bar" onclick="event.stopPropagation()">
            <span id="lightbox-counter" class="lightbox-counter">1 / 1</span>
            <div class="lightbox-top-actions">
                <button type="button" id="lightbox-edit-btn" class="lightbox-action-pill" onclick="openPhotoEditorFromLightbox(event)" title="Modifica Foto">
                    <span class="material-icons">tune</span>
                    <span>Modifica Foto</span>
                </button>
                <a id="lightbox-download-btn" class="lightbox-action-pill" href="#" download title="Scarica">
                    <span class="material-icons">download</span>
                    <span>Scarica</span>
                </a>
                <button type="button" class="close-btn" onclick="closeLightbox()" title="Chiudi" aria-label="Chiudi Lightbox">
                    <span class="material-icons">close</span>
                </button>
            </div>
        </div>

        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button type="button" class="nav-btn prev-btn" onclick="navigateMedia(-1, event)" title="Precedente" aria-label="Media precedente">
                <span class="material-icons">chevron_left</span>
            </button>
            
            <div class="media-container" onclick="closeLightbox()">
                <img id="lightbox-img" alt="Anteprima" style="display: none;" onclick="event.stopPropagation()">
                <video id="lightbox-video" controls playsinline style="display: none;" onclick="event.stopPropagation()">
                    <source src="" type="video/mp4">
                    Il tuo browser non supporta i video.
                </video>
            </div>
            
            <button type="button" class="nav-btn next-btn" onclick="navigateMedia(1, event)" title="Successivo" aria-label="Media successivo">
                <span class="material-icons">chevron_right</span>
            </button>
        </div>
    </div>

    <!-- MATERIAL YOU PHOTO EDITOR STUDIO MODAL -->
    <div id="photo-editor-modal" class="photo-editor-modal" style="display: none;" role="dialog" aria-modal="true" aria-label="Editor Foto PhotoCloud">
        <header class="photo-editor-header">
            <div class="photo-editor-title-wrap">
                <button type="button" class="btn icon" id="editor-close-btn" title="Annulla e chiudi editor" aria-label="Chiudi Editor">
                    <span class="material-icons">close</span>
                </button>
                <div>
                    <h2 id="editor-filename-title">Modifica Foto</h2>
                    <span id="editor-resolution-badge" class="editor-sub-badge">Canvas HD Crittografato</span>
                </div>
            </div>
            <div class="photo-editor-header-actions">
                <button type="button" class="btn outlined" id="editor-reset-btn" title="Ripristina modifiche">
                    <span class="material-icons">restart_alt</span>
                    <span class="btn-text">Reset</span>
                </button>
                <button type="button" class="btn outlined" id="editor-save-overwrite-btn" title="Sovrascrivi la foto originale">
                    <span class="material-icons">save</span>
                    <span class="btn-text">Sovrascrivi</span>
                </button>
                <button type="button" class="btn primary" id="editor-save-copy-btn" title="Salva come nuova copia nell'archivio">
                    <span class="material-icons">add_photo_alternate</span>
                    <span class="btn-text">Salva Copia</span>
                </button>
            </div>
        </header>

        <div class="photo-editor-stage" id="photo-editor-stage">
            <div class="photo-editor-canvas-wrapper" id="photo-editor-canvas-wrapper">
                <canvas id="photo-editor-canvas" data-testid="photo-editor-canvas"></canvas>
                <div id="photo-editor-crop-overlay" class="photo-editor-crop-overlay active" data-testid="photo-editor-crop-overlay" aria-label="Griglia di ritaglio manuale trascinabile">
                    <div id="photo-editor-crop-box" class="photo-editor-crop-box" data-crop-handle="move" style="left: 0%; top: 0%; width: 100%; height: 100%;">
                        <!-- Rule of Thirds 3x3 Grid Lines -->
                        <div class="crop-grid-line crop-grid-h1"></div>
                        <div class="crop-grid-line crop-grid-h2"></div>
                        <div class="crop-grid-line crop-grid-v1"></div>
                        <div class="crop-grid-line crop-grid-v2"></div>

                        <!-- Live Cropped Pixel Dimensions Readout -->
                        <div id="crop-box-dimensions-label" class="crop-box-dimensions-label">Ritaglio Manuale</div>

                        <!-- 8 Interactive Drag Handles (4 Corners + 4 Edges) -->
                        <div class="crop-handle crop-handle-nw" data-crop-handle="nw" title="Trascina angolo alto-sinistra"></div>
                        <div class="crop-handle crop-handle-n" data-crop-handle="n" title="Trascina bordo superiore"></div>
                        <div class="crop-handle crop-handle-ne" data-crop-handle="ne" title="Trascina angolo alto-destra"></div>
                        <div class="crop-handle crop-handle-e" data-crop-handle="e" title="Trascina bordo destro"></div>
                        <div class="crop-handle crop-handle-se" data-crop-handle="se" title="Trascina angolo basso-destra"></div>
                        <div class="crop-handle crop-handle-s" data-crop-handle="s" title="Trascina bordo inferiore"></div>
                        <div class="crop-handle crop-handle-sw" data-crop-handle="sw" title="Trascina angolo basso-sinistra"></div>
                        <div class="crop-handle crop-handle-w" data-crop-handle="w" title="Trascina bordo sinistro"></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="photo-editor-controls">
            <!-- Filter Presets Row -->
            <div class="editor-presets-row" role="group" aria-label="Filtri predefiniti">
                <button type="button" class="editor-preset-chip active" data-preset="original">Originale</button>
                <button type="button" class="editor-preset-chip" data-preset="vivid">Vivido</button>
                <button type="button" class="editor-preset-chip" data-preset="bw">Bianco &amp; Nero</button>
                <button type="button" class="editor-preset-chip" data-preset="sepia">Seppia</button>
                <button type="button" class="editor-preset-chip" data-preset="cinema">Cinema</button>
                <button type="button" class="editor-preset-chip" data-preset="cool">Freddo</button>
                <button type="button" class="editor-preset-chip" data-preset="vintage">Vintage</button>
            </div>

            <!-- Sliders Grid -->
            <div class="editor-sliders-grid">
                <label class="editor-slider-item">
                    <div class="editor-slider-label">
                        <span><span class="material-icons">light_mode</span> Luminosità</span>
                        <strong id="val-brightness">0</strong>
                    </div>
                    <input type="range" id="slider-brightness" min="-100" max="100" value="0" aria-label="Luminosità">
                </label>

                <label class="editor-slider-item">
                    <div class="editor-slider-label">
                        <span><span class="material-icons">contrast</span> Contrasto</span>
                        <strong id="val-contrast">0</strong>
                    </div>
                    <input type="range" id="slider-contrast" min="-100" max="100" value="0" aria-label="Contrasto">
                </label>

                <label class="editor-slider-item">
                    <div class="editor-slider-label">
                        <span><span class="material-icons">palette</span> Saturazione</span>
                        <strong id="val-saturation">0</strong>
                    </div>
                    <input type="range" id="slider-saturation" min="-100" max="100" value="0" aria-label="Saturazione">
                </label>

                <label class="editor-slider-item">
                    <div class="editor-slider-label">
                        <span><span class="material-icons">thermostat</span> Calore</span>
                        <strong id="val-warmth">0</strong>
                    </div>
                    <input type="range" id="slider-warmth" min="-100" max="100" value="0" aria-label="Calore">
                </label>
            </div>

            <!-- Transform & Crop Toolbar -->
            <div class="editor-transform-toolbar">
                <div class="editor-tool-group">
                    <button type="button" class="editor-tool-btn active" id="editor-toggle-crop-grid-btn" title="Mostra/Nascondi griglia di ritaglio trascinabile">
                        <span class="material-icons">grid_on</span>
                        <span>Griglia Ritaglio</span>
                    </button>
                    <button type="button" class="editor-tool-btn" id="editor-rotate-left-btn" title="Ruota di -90°">
                        <span class="material-icons">rotate_left</span>
                        <span>-90°</span>
                    </button>
                    <button type="button" class="editor-tool-btn" id="editor-rotate-right-btn" title="Ruota di +90°">
                        <span class="material-icons">rotate_right</span>
                        <span>+90°</span>
                    </button>
                    <button type="button" class="editor-tool-btn" id="editor-flip-h-btn" title="Specchia Orizzontalmente">
                        <span class="material-icons">flip</span>
                        <span>Specchia Oriz.</span>
                    </button>
                    <button type="button" class="editor-tool-btn" id="editor-flip-v-btn" title="Specchia Verticalmente">
                        <span class="material-icons" style="transform: rotate(90deg);">flip</span>
                        <span>Specchia Vert.</span>
                    </button>
                </div>

                <div class="editor-crop-group" role="group" aria-label="Proporzioni ritaglio">
                    <span class="crop-label"><span class="material-icons">crop</span> Ritaglio:</span>
                    <button type="button" class="editor-crop-chip active" data-crop="free">Libero</button>
                    <button type="button" class="editor-crop-chip" data-crop="1:1">1:1</button>
                    <button type="button" class="editor-crop-chip" data-crop="4:5">4:5</button>
                    <button type="button" class="editor-crop-chip" data-crop="4:3">4:3</button>
                    <button type="button" class="editor-crop-chip" data-crop="16:9">16:9</button>
                </div>
            </div>
        </section>
    </div>
    
    <script src="{{ url_for('static', filename='scripts/lightbox.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/photo-editor.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
