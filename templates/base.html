<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoCloud | Il tuo archivio sicuro</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="nav-btn prev-btn" onclick="navigateMedia(-1, event)">
                <span class="material-icons">arrow_back</span>
            </button>
            
            <div class="media-container">
                <img id="lightbox-img" src="" alt="">
                <video id="lightbox-video" controls>
                    <source src="" type="video/mp4">
                    Il tuo browser non supporta i video.
                </video>
            </div>
            
            <button class="nav-btn next-btn" onclick="navigateMedia(1, event)">
                <span class="material-icons">arrow_forward</span>
            </button>
            
            </div>
        
        <button class="close-btn" onclick="closeLightbox()">
            <span class="material-icons">close</span>
        </button>
    </div>
    
    <script src="{{ url_for('static', filename='scripts/lightbox.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
