[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `server`, generated by rust-anything: Rust owns the server, the original answers what is not ported yet"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.5"
rand = "0.8"
hkdf = "0.12"

[workspace]
