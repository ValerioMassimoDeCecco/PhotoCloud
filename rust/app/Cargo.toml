[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false
description = "PhotoCloud standalone pure Rust server (100% Zero-Knowledge E2EE v2 only — zero symmetric cipher crates)"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.5"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace]
