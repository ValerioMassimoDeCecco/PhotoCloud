[request]
method = "POST"
path = "/api/favorites/toggle"
body = "{}"

[request.headers]
Content-Type = "application/json"

[response]
status = 403

[response.headers]
content-security-policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
content-type = "application/json; charset=utf-8"
cross-origin-opener-policy = "same-origin"
permissions-policy = "camera=(), microphone=(), geolocation=()"
referrer-policy = "strict-origin-when-cross-origin"
x-content-type-options = "nosniff"
x-frame-options = "SAMEORIGIN"
