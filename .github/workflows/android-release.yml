name: Build & Publish Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag della Release GitHub (es. v1.2.5)'
        required: false
        default: 'v1.2.5'
      publish_release:
        description: 'Pubblica l APK su GitHub Releases (solo su main o tag v*)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-android-release:
    name: Compile Signed APK & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Persistent Release Keystore (RSA-2048 from v1.0.4)
        working-directory: ./android-app/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > photocloud-release-key.jks
          elif [ ! -f photocloud-release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore photocloud-release-key.jks \
              -alias photocloud-release-key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-photocloud_release_2026}" \
              -keypass "${KEY_PASSWORD:-photocloud_release_2026}" \
              -dname "CN=ValerioMassimoDeCecco, OU=PhotoCloud, O=PhotoCloud, L=Rome, S=RM, C=IT"
          fi
          keytool -list -v \
            -keystore photocloud-release-key.jks \
            -alias photocloud-release-key \
            -storepass "${KEYSTORE_PASSWORD:-photocloud_release_2026}"

      - name: Build Signed Release APK with Gradle
        working-directory: ./android-app
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          APK_OUT=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_OUT" ]; then
            echo "Errore: nessun file APK trovato in app/build/outputs/apk/release"
            exit 1
          fi
          cp "$APK_OUT" ../photocloud-release-v1.2.5-signed.apk
          sha256sum ../photocloud-release-v1.2.5-signed.apk > ../photocloud-release-v1.2.5-signed.apk.sha256

      - name: Upload Signed APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photocloud-release-signed-apk
          path: |
            photocloud-release-v1.2.5-signed.apk
            photocloud-release-v1.2.5-signed.apk.sha256
            release/photocloud-release-build.json
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v1.2.5" >> $GITHUB_OUTPUT
          fi

      - name: Publish Signed APK to GitHub Releases
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release != false && inputs.publish_release != 'false') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.TAG }}
          name: PhotoCloud Android Release ${{ steps.release_meta.outputs.TAG }}
          body: |
            ### PhotoCloud Android Release (${{ steps.release_meta.outputs.TAG }})
            Compilato automaticamente tramite **GitHub Actions** (JDK 17 + Android SDK 35 + Gradle 8.10.2) con la **stessa firma Keystore della v1.0.4–v1.2.4** per aggiornamento diretto.

            - **Application ID**: `com.valerio.photocloud`
            - **Versione**: `1.2.5` (`versionCode 22`)
            - **Novità v1.2.5 — Security Hardening Completo (OWASP Top 10 & ASVS)**:
              - **Hardening Web, API & Vault**: protezione Stored/DOM XSS con sandbox CSP, difesa CSRF Origin, blocco dot-file/Path Traversal/Prototype Pollution, verifica chiavi constant-time e rate-limiting anti-brute-force.
              - **Hardening Client Android & Parser Documenti**: protezione anti-Zip Bomb nella lettura di archivi Office/OpenDocument e sanitizzazione dei percorsi cache in `PhotoCloudApiClient`.
            - **APK Firmato**: `photocloud-release-v1.2.5-signed.apk`
            - **Checksum SHA-256**: `photocloud-release-v1.2.5-signed.apk.sha256`
          files: |
            photocloud-release-v1.2.5-signed.apk
            photocloud-release-v1.2.5-signed.apk.sha256
            release/photocloud-release-build.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
