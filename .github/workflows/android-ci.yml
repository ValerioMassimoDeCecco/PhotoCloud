name: Android Kotlin Compile CI

on:
  push:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android-kotlin:
    name: Verify Android Release Kotlin Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Release Kotlin Compilation & Release APK Build
        working-directory: ./android-app
        run: |
          gradle :app:compileReleaseKotlin :app:assembleRelease --no-daemon --stacktrace
