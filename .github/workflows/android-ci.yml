name: Android Kotlin, Interop & Web E2E CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-tests:
    name: Kotlin Unit Tests (JDK 17, Gradle 8.10.2) & Reverse Interop Fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare CI Signing Keystore
        working-directory: ./android-app/app
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTOCLOUD_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.PHOTOCLOUD_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.PHOTOCLOUD_KEY_ALIAS || secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.PHOTOCLOUD_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-signing.jks
            STORE_PASS="$SECRET_STORE_PASS"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="$SECRET_KEY_PASS"
          else
            STORE_PASS="$(openssl rand -hex 16)"
            KEY_ALIAS="photocloud-release-key"
            KEY_PASS="$STORE_PASS"
            rm -f release-signing.jks
            keytool -genkeypair -v \
              -keystore release-signing.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=PhotoCloud, OU=Mobile, O=Valerio, L=Rome, ST=RM, C=IT"
          fi
          {
            echo "PHOTOCLOUD_KEYSTORE_PATH=release-signing.jks"
            echo "PHOTOCLOUD_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "PHOTOCLOUD_KEY_ALIAS=$KEY_ALIAS"
            echo "PHOTOCLOUD_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Run Android Unit Tests (testDebugUnitTest under -Xmx128m)
        working-directory: ./android-app
        run: |
          set -o pipefail
          gradle testDebugUnitTest --info --no-daemon --stacktrace 2>&1 | tee unit-test-execution.log

      - name: Upload Kotlin-to-Web Interop Fixtures Artifact
        uses: actions/upload-artifact@v4
        with:
          name: interop-kotlin-fixtures
          path: android-app/app/build/interop-kotlin/**
          if-no-files-found: error

      - name: Upload Android Unit Test Logs and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-logs
          path: |
            android-app/unit-test-execution.log
            android-app/app/build/reports/tests/testDebugUnitTest/**
            android-app/app/build/test-results/testDebugUnitTest/**

      - name: Publish Kotlin Unit Test Summary
        if: always()
        working-directory: ./android-app
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          result_files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          total = passed = failed = errored = skipped = 0
          failed_tests = []

          for path in result_files:
              root = ET.parse(path).getroot()
              suite_total = int(root.get("tests", "0"))
              suite_failures = int(root.get("failures", "0"))
              suite_errors = int(root.get("errors", "0"))
              suite_skipped = int(root.get("skipped", "0"))
              total += suite_total
              failed += suite_failures
              errored += suite_errors
              skipped += suite_skipped
              passed += suite_total - suite_failures - suite_errors - suite_skipped
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is not None:
                          message = (node.get("message") or "").strip().splitlines()
                          detail = message[0] if message else ""
                          failed_tests.append(
                              f"{case.get('classname')}.{case.get('name')} [{kind}]: {detail}"
                          )

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Kotlin Unit Tests (testDebugUnitTest, -Xmx128m)\n\n")
              if not result_files:
                  summary.write("No `TEST-*.xml` result files were produced.\n")
              else:
                  summary.write("| Executed | Passed | Failed | Errors | Skipped |\n")
                  summary.write("|---|---|---|---|---|\n")
                  summary.write(f"| {total} | {passed} | {failed} | {errored} | {skipped} |\n\n")
                  summary.write(f"Result suites parsed: {len(result_files)}\n")
                  if failed_tests:
                      summary.write("\n### Failed tests\n\n")
                      for item in failed_tests:
                          summary.write(f"- `{item}`\n")
                  else:
                      summary.write("\nAll Kotlin unit tests passed.\n")
          PY

      - name: Verify Release Kotlin Compilation & Release APK Build
        working-directory: ./android-app
        run: |
          gradle :app:compileReleaseKotlin :app:assembleRelease --no-daemon --stacktrace

  interop:
    name: Bidirectional Interop Verification (Kotlin <-> TypeScript <-> Python)
    needs: kotlin-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js >= 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.13.0'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Interop Dependencies
        run: pip install --no-cache-dir cryptography argon2-cffi

      - name: Download Kotlin-to-Web Interop Fixtures Artifact
        uses: actions/download-artifact@v4
        with:
          name: interop-kotlin-fixtures
          path: android-app/app/build/interop-kotlin

      - name: Verify Downloaded Kotlin Interop Manifest Exists
        run: |
          test -f android-app/app/build/interop-kotlin/manifest.json
          test -f android-app/app/build/interop-kotlin/blob.pczk
          test -f android-app/app/build/interop-kotlin/wrappedVk.bin
          test -f android-app/app/build/interop-kotlin/encMeta.bin

      - name: Run TypeScript SDK + Reverse Interop Tests (FAIL if Kotlin artifact missing)
        env:
          REQUIRE_KOTLIN_ARTIFACTS: '1'
          INTEROP_KOTLIN_DIR: android-app/app/build/interop-kotlin
        run: ./node_modules/.bin/tsx --test src/lib/zkWebSdk.test.ts

      - name: Run Independent Python Interop Verifier (Forward & Reverse)
        env:
          REQUIRE_KOTLIN_ARTIFACTS: '1'
        run: python3 scripts/verify-interop.py --require-kotlin --kotlin-dir android-app/app/build/interop-kotlin

  web-e2e:
    name: Web /v2 Browser E2E (Playwright Chromium + Service Worker Range)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js >= 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.13.0'

      - name: Install Dependencies & Build Web App
        run: |
          npm ci
          npm run build

      - name: Install Playwright & Chromium with System Deps
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Execute PhotoCloud v2 Browser E2E Flows (1..9)
        run: bash scripts/run-v2-playwright-e2e.sh

      - name: Upload Playwright E2E Traces & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v2-playwright-e2e-artifacts
          path: .playwright-e2e-artifacts/**
          if-no-files-found: warn
